<!DOCTYPE html>
<html lang="ru">

<head>
  <script src="js/sync-theme.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/variables-of-theme.css">
  <script src="js/application.js" defer></script>
</head>

<body>
  <section class="theFirstTask">
    <p class="greeting"></p>
  </section>
  <section class="theSecondTask">
    <div class="counter">0</div>
    <div class="buttons">
      <button type="button" class="buttonMinus">-100000</button>
      <button type="button" class="buttonPlus">+100000</button>
    </div>
  </section>
  <section class="theThirdTask">
    <div class="hidden">Невидимка</div>
    <button type="button" class="contentButton">Показать содержимое</button>
  </section>
  <section class="theFourthTask"></section>
  <section class="theSixthTask">
    <div class="timeCounter">Секундомер</div>
    <div class="timer">0</div>
    <div class="timerButtons">
      <button type="button" class="startButtonTimer">Старт</button>
      <button type="button" class="stopButtonTimer">Стоп</button>
      <button type="button" class="clearButtonTimer">Сброс</button>
    </div>
    <div class="startTimerQuestion">
      <p class="question">Запустить секундомер?</p>
      <div class="answerButtons">
        <button type="button" class="answerYesButton">Да</button>
        <button type="button" class="answerNoButton">Нет</button>
      </div>
    </div>
    <script src="js/timer.js"></script>
  </section>
  <section class="theFifthTask">
    <form class="clientInfo">
      <label for="yourSurname">Фамилия:</label>
      <input type="text" id="yourSurname" class="yourSurname">
      <label for="yourName">Имя:</label>
      <input type="text" id="yourName" class="yourName">
      <label for="yourPatronymic">Отчество:</label>
      <input type="text" id="yourPatronymic" class="yourPatronymic">
      <label for="yourEmail">Email:</label>
      <input type="text" id="yourEmail" class="yourEmail">
      <button type="submit">Отправить</button>
    </form>
    <span class="resultOfSubmit" id="resultOfSubmit"></span>
  </section>
  <button id="themeToggle" class="themeButton" type="button">
    <svg class="sunIcon" viewBox="0 0 50 50" width="50" height="50">
      <circle cx="25" cy="25" r="9" fill="#FFA500" />
      <g stroke="#FFA500" stroke-width="3" stroke-linecap="round">
        <line x1="25" y1="4" x2="25" y2="10" />
        <line x1="25" y1="40" x2="25" y2="46" />
        <line x1="4" y1="25" x2="10" y2="25" />
        <line x1="40" y1="25" x2="46" y2="25" />
        <line x1="14.39" y1="14.39" x2="10.15" y2="10.15" />
        <line x1="35.61" y1="14.39" x2="39.85" y2="10.15" />
        <line x1="14.39" y1="35.61" x2="10.15" y2="39.85" />
        <line x1="35.61" y1="35.61" x2="39.85" y2="39.85" />
      </g>
    </svg>
    <svg class="moonIcon" viewBox="0 0 50 50" width="50" height="50">
      <g fill="#3A3F58" transform="translate(3, 3)">
        <path d="M40.35,32.85 
             A 20,20 0 1,1 24.5,4.5 
             A 16,16 0 0,0 40.35,32.85 Z" />
        <path d="M33,4 Q33,8 37,8 Q33,8 33,12 Q33,8 29,8 Q33,8 33,4 Z" stroke="#3A3F58" stroke-width="1.5"
          stroke-linejoin="round" />
      </g>
    </svg>
  </button>
  <script src="js/theme.js"></script>
</body>

</html>
