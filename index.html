<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script src="application.js" defer></script>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <section class="theFirstTask">
    <p class="greeting"></p>
  </section>
  <section class="theSecondTask">
    <div class="counter">0</div>
    <div class="buttons">
      <button type="button" class="buttonMinus">-100000</button>
      <button type="button" class="buttonPlus">+100000</button>
    </div>
  </section>
  <section class="theThirdTask">
    <div class="hidden">Невидимка</div>
    <button type="button" class="contentButton">Показать содержимое</button>
  </section>
  <section class="theFourthTask"></section>
  <section class="theFifthTask">
    <form class="clientInfo">
      <label for="yourSurname">Фамилия</label>
      <input type="text" id="yourSurname" class="yourSurname">
      <label for="yourName">Имя:</label>
      <input type="text" id="yourName" class="yourName">
      <label for="yourPatronymic">Отчество:</label>
      <input type="text" id="yourPatronymic" class="yourPatronymic">
      <label for="yourEmail">Email:</label>
      <input type="text" id="yourEmail" class="yourEmail">
      <button type="submit">Отправить</button>
    </form>
    <span class="resultOfSubmit" id="resultOfSubmit"></span>
  </section>
</body>

</html>
